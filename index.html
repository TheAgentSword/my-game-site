<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Game Site</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        h1 {
            font-size: 3em;
            margin-bottom: 10px;
        }
        
        .subtitle {
            font-size: 1.2em;
            opacity: 0.9;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .controls {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .search-box {
            padding: 12px 20px;
            width: 100%;
            max-width: 500px;
            border: none;
            border-radius: 5px;
            font-size: 1em;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        
        .filter-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 15px;
        }
        
        .filter-btn {
            background: rgba(255,255,255,0.2);
            color: white;
            border: 2px solid white;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        
        .filter-btn:hover {
            background: white;
            color: #667eea;
        }
        
        .filter-btn.active {
            background: white;
            color: #667eea;
        }
        
        .game-count {
            color: white;
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.1em;
            font-weight: bold;
        }
        
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .game-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: all 0.3s;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            text-decoration: none;
            color: inherit;
        }
        
        .game-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }
        
        .game-card h3 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 1.2em;
        }
        
        .game-card p {
            color: #666;
            margin-bottom: 15px;
            font-size: 0.9em;
        }
        
        .game-card .category {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.8em;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .play-btn {
            background: #667eea;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            text-align: center;
            font-weight: bold;
            border: none;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s;
        }
        
        .play-btn:hover {
            background: #764ba2;
            transform: scale(1.05);
        }
        
        .footer {
            text-align: center;
            color: white;
            margin-top: 50px;
            opacity: 0.8;
        }
        
        .no-games {
            text-align: center;
            color: white;
            font-size: 1.2em;
            margin-top: 40px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎮 My Game Site</h1>
        <p class="subtitle">Play Free Games - Click to Open in New Tab</p>
    </div>
    
    <div class="container">
        <div class="controls">
            <input 
                type="text" 
                id="searchBox" 
                class="search-box" 
                placeholder="🔍 Search games..."
                onkeyup="filterGames()"
            >
            <div class="filter-buttons" id="filterButtons"></div>
        </div>
        
        <div class="game-count" id="gameCount"></div>
        
        <div class="games-grid" id="gamesGrid"></div>
        
        <div id="noGames" class="no-games" style="display:none;">
            No games found. Try a different search!
        </div>
    </div>
    
    <div class="footer">
        <p>&copy; 2024 My Game Site. All games are free & open-source.</p>
    </div>
    
    <script>
        const ALL_GAMES = [
            // Action & Adventure
            { name: 'Flappy Bird', link: 'https://flappybird.io/', category: 'Action' },
            { name: 'Dino Runner', link: 'https://chromedino.com/', category: 'Action' },
            { name: 'Pong', link: 'https://pong-game.org/', category: 'Action' },
            { name: 'Tank Trouble', link: 'https://www.tanktrouble.com/', category: 'Action' },
            { name: 'Duck Hunt', link: 'https://duckhunt.me/', category: 'Action' },
            
            // Puzzle
            { name: '2048', link: 'https://play2048.co/', category: 'Puzzle' },
            { name: 'Tetris', link: 'https://tetris.com/play-tetris', category: 'Puzzle' },
            { name: 'Sudoku', link: 'https://sudoku.com/', category: 'Puzzle' },
            { name: 'Threes!', link: 'https://threesjs.com/', category: 'Puzzle' },
            
            // Classic Games
            { name: 'Pac-Man', link: 'https://pacman.live/', category: 'Classic' },
            { name: 'Snake', link: 'https://playsnakegame.org/', category: 'Classic' },
            { name: 'Minesweeper', link: 'https://minesweeper.online/', category: 'Classic' },
            { name: 'Breakout', link: 'https://breakoutgame.org/', category: 'Classic' },
            
            // Multiplayer/Online
            { name: 'Agar.io', link: 'https://agar.io/', category: 'Multiplayer' },
            { name: 'Slither.io', link: 'https://slither.io/', category: 'Multiplayer' },
            { name: 'Diep.io', link: 'https://diep.io/', category: 'Multiplayer' },
            { name: 'Splix.io', link: 'https://splix.io/', category: 'Multiplayer' },
            { name: 'Paper.io', link: 'https://paper.io/', category: 'Multiplayer' },
            
            // Strategy
            { name: 'Chess.com', link: 'https://www.chess.com/', category: 'Strategy' },
            { name: 'Wordle', link: 'https://www.wordle.com/', category: 'Strategy' },
            
            // Clicker/Idle
            { name: 'Cookie Clicker', link: 'https://orteil.dashnet.org/cookieclicker/', category: 'Idle' },
            { name: 'Idle Breakout', link: 'https://idlebreakout.com/', category: 'Idle' },
            
            // Racing
            { name: 'Moto X3M', link: 'https://www.motox3m.io/', category: 'Racing' },
            { name: 'Car Parking Multiplayer', link: 'https://carparkingmultiplayer.com/', category: 'Racing' },
            
            // Shooting
            { name: 'Zombs Royale', link: 'https://zombsroyale.io/', category: 'Shooting' },
            { name: 'Shell Shockers', link: 'https://shellshock.io/', category: 'Shooting' },
            { name: 'Krunker.io', link: 'https://krunker.io/', category: 'Shooting' },
            
            // Card Games
            { name: 'Solitaire', link: 'https://solitaire.com/', category: 'Card' },
            { name: 'Hearts', link: 'https://www.247hearts.com/', category: 'Card' },
            
            // Adventure
            { name: 'A Dark Room', link: 'https://adarkroom.doublespeakgames.com/', category: 'Adventure' },
            
            // Word Games
            { name: 'Hangman', link: 'https://hangman.letsdohangman.com/', category: 'Word' },
            
            // Sports
            { name: 'Basketball Stars', link: 'https://basketball-stars.com/', category: 'Sports' },
        ];
        
        let filteredGames = [];
        let selectedCategory = 'All';
        
        // Initialize
        window.addEventListener('load', function() {
            displayGames(ALL_GAMES);
            createFilterButtons();
        });
        
        // Create filter buttons
        function createFilterButtons() {
            const categories = ['All', ...new Set(ALL_GAMES.map(g => g.category))];
            const filterButtons = document.getElementById('filterButtons');
            
            filterButtons.innerHTML = categories.map(cat => `
                <button class="filter-btn ${cat === 'All' ? 'active' : ''}" onclick="filterByCategory('${cat}')">
                    ${cat}
                </button>
            `).join('');
        }
        
        // Filter by category
        function filterByCategory(category) {
            selectedCategory = category;
            
            // Update active button
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.toggle('active', btn.textContent.trim() === category);
            });
            
            filterGames();
        }
        
        // Filter games
        function filterGames() {
            const searchTerm = document.getElementById('searchBox').value.toLowerCase();
            
            filteredGames = ALL_GAMES.filter(game => {
                const matchesSearch = game.name.toLowerCase().includes(searchTerm);
                const matchesCategory = selectedCategory === 'All' || game.category === selectedCategory;
                return matchesSearch && matchesCategory;
            });
            
            displayGames(filteredGames);
        }
        
        // Display games
        function displayGames(games) {
            const gamesGrid = document.getElementById('gamesGrid');
            const gameCount = document.getElementById('gameCount');
            const noGames = document.getElementById('noGames');
            
            gameCount.textContent = `📊 ${games.length} Games Available`;
            
            if (games.length === 0) {
                gamesGrid.innerHTML = '';
                noGames.style.display = 'block';
                return;
            }
            
            noGames.style.display = 'none';
            
            gamesGrid.innerHTML = games.map((game, index) => `
                <a href="${game.link}" target="_blank" rel="noopener noreferrer" class="game-card">
                    <div>
                        <div class="category">${game.category}</div>
                        <h3>${game.name}</h3>
                        <p>Click to play in a new tab</p>
                    </div>
                    <button class="play-btn" onclick="event.preventDefault(); window.open('${game.link}', '_blank');">
                        ▶ Play Now
                    </button>
                </a>
            `).join('');
        }
    </script>
</body>
</html>
