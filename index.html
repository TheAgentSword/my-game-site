<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Game Site</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            width: 100%;
        }
        
        header {
            text-align: center;
            color: white;
            margin-bottom: 50px;
        }
        
        h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .subtitle {
            font-size: 1.2em;
            opacity: 0.9;
        }
        
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        
        .game-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }
        
        .game-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 12px rgba(0,0,0,0.2);
        }
        
        .game-card h3 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 1.3em;
        }
        
        .game-card p {
            color: #666;
            margin-bottom: 15px;
            font-size: 0.9em;
        }
        
        .game-card a {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            text-decoration: none;
            transition: background 0.3s;
            font-weight: bold;
        }
        
        .game-card a:hover {
            background: #764ba2;
        }
        
        .loading {
            text-align: center;
            color: white;
            font-size: 1.2em;
            margin-top: 30px;
        }
        
        footer {
            text-align: center;
            color: white;
            margin-top: 50px;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎮 My Game Site</h1>
            <p class="subtitle">A collection of free & open-source games</p>
        </header>
        
        <div id="games-container" class="games-grid">
            <div class="loading">Loading games...</div>
        </div>
        
        <footer>
            <p>&copy; 2024 My Game Site. All games are free & open-source.</p>
        </footer>
    </div>
    
    <script>
        // Load games from games.json
        async function loadGames() {
            try {
                const response = await fetch('./games.json');
                const games = await response.json();
                displayGames(games);
            } catch (error) {
                console.log('games.json not found, displaying placeholder');
                displayPlaceholder();
            }
        }
        
        function displayGames(games) {
            const container = document.getElementById('games-container');
            container.innerHTML = '';
            
            if (games.length === 0) {
                displayPlaceholder();
                return;
            }
            
            games.forEach(game => {
                const card = document.createElement('div');
                card.className = 'game-card';
                card.innerHTML = `
                    <h3>${game.name}</h3>
                    <p>${game.source || 'Free Game'}</p>
                    <a href="${game.link}" target="_blank">Play Now</a>
                `;
                container.appendChild(card);
            });
        }
        
        function displayPlaceholder() {
            const container = document.getElementById('games-container');
            container.innerHTML = `
                <div class="game-card">
                    <h3>No Games Yet</h3>
                    <p>Games will appear here once you add them.</p>
                    <p style="font-size: 0.8em; color: #999;">Run the scraper to add free games!</p>
                </div>
            `;
        }
        
        // Load games when page loads
        loadGames();
    </script>
</body>
</html>
