<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Howdy</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #0f0f1e 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 50px;
        }
        
        h1 {
            font-size: 3em;
            margin-bottom: 10px;
        }
        
        .controls {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .scrape-btn {
            background: white;
            color: #667eea;
            padding: 20px 60px;
            border: none;
            border-radius: 10px;
            font-size: 1.3em;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            transition: all 0.3s;
        }
        
        .scrape-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 30px rgba(0,0,0,0.6);
        }
        
        .scrape-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .status {
            text-align: center;
            color: white;
            font-size: 1.1em;
            margin-bottom: 20px;
            min-height: 30px;
        }
        
        .spinner {
            display: inline-block;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1400px;
        }
        
        .game-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.3s;
            cursor: pointer;
        }
        
        .game-card:hover {
            transform: translateY(-5px);
        }
        
        .game-card h3 {
            color: #667eea;
            margin-bottom: 10px;
        }
        
        .game-card p {
            color: #666;
            margin-bottom: 15px;
            font-size: 0.9em;
        }
        
        .game-card button {
            background: #667eea;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1em;
        }
        
        .game-card button:hover {
            background: #764ba2;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎮 My Game Site</h1>
        <p style="color: white; font-size: 1.1em;">Play Free Games</p>
    </div>
    
    <div class="controls">
        <button class="scrape-btn" id="scrapeBtn" onclick="scrapeGames()">
            🔍 Run Scraper
        </button>
    </div>
    
    <div class="status" id="status"></div>
    
    <div class="games-grid" id="games"></div>
    
    <script>
        async function scrapeGames() {
            const btn = document.getElementById('scrapeBtn');
            const status = document.getElementById('status');
            const gamesGrid = document.getElementById('games');
            
            btn.disabled = true;
            status.innerHTML = '<span class="spinner">⏳</span> Scraping games...';
            gamesGrid.innerHTML = '';
            
            try {
                // Fetch games from Y8.com
                const response = await fetch('https://www.y8.com/games');
                const html = await response.text();
                
                // Parse game links
                const gamePattern = /href="(\/games\/[^"]+)"[^>]*>([^<]+)<\/a>/g;
                const games = [];
                let match;
                
                while ((match = gamePattern.exec(html)) !== null && games.length < 20) {
                    const link = 'https://www.y8.com' + match[1];
                    const name = match[2].trim();
                    
                    if (name.length > 2 && name.length < 50) {
                        games.push({
                            name: name,
                            link: link,
                            id: name.toLowerCase().replace(/\s+/g, '-')
                        });
                    }
                }
                
                if (games.length === 0) {
                    throw new Error('No games scraped');
                }
                
                displayGames(games);
                status.innerHTML = `<span style="color: #51cf66;">✓ Found ${games.length} games!</span>`;
                
            } catch (error) {
                console.error('Scraping error:', error);
                status.innerHTML = '<span style="color: #ff6b6b;">✗ Error scraping. Loading popular games...</span>';
                displayFallbackGames();
            }
            
            btn.disabled = false;
        }
        
        function displayFallbackGames() {
            const fallbackGames = [
                { name: 'Flappy Bird', link: 'https://flappybird.io/', id: 'flappybird' },
                { name: 'Pong', link: 'https://pong-game.org/', id: 'pong' },
                { name: 'Dino Runner', link: 'https://chromedino.com/', id: 'dino' },
                { name: '2048', link: 'https://play2048.co/', id: '2048' },
                { name: 'Tetris', link: 'https://tetris.com/play-tetris', id: 'tetris' },
                { name: 'Sudoku', link: 'https://sudoku.com/', id: 'sudoku' },
                { name: 'Pac-Man', link: 'https://pacman.live/', id: 'pacman' },
                { name: 'Snake', link: 'https://playsnakegame.org/', id: 'snake' },
                { name: 'Minesweeper', link: 'https://minesweeper.online/', id: 'minesweeper' },
                { name: 'Agar.io', link: 'https://agar.io/', id: 'agario' },
                { name: 'Slither.io', link: 'https://slither.io/', id: 'slither' },
                { name: 'Diep.io', link: 'https://diep.io/', id: 'diep' },
                { name: 'Chess.com', link: 'https://www.chess.com/', id: 'chess' },
                { name: 'Wordle', link: 'https://www.wordle.com/', id: 'wordle' },
                { name: 'Cookie Clicker', link: 'https://orteil.dashnet.org/cookieclicker/', id: 'cookieclicker' },
                { name: 'Idle Breakout', link: 'https://idlebreakout.com/', id: 'idlebreakout' },
                { name: 'Moto X3M', link: 'https://www.motox3m.io/', id: 'motox3m' },
                { name: 'Zombs Royale', link: 'https://zombsroyale.io/', id: 'zombsroyale' },
                { name: 'Solitaire', link: 'https://solitaire.com/', id: 'solitaire' },
                { name: 'A Dark Room', link: 'https://adarkroom.doublespeakgames.com/', id: 'darkroom' },
            ];
            
            displayGames(fallbackGames);
            document.getElementById('status').innerHTML = '<span style="color: #51cf66;">✓ Loaded 20 popular games!</span>';
        }
        
        function playGame(gameName, gameId, gameLink) {
            const newTab = window.open('', '_blank');
            newTab.document.write(`
                <!DOCTYPE html>
                <html>
                <head>
                    <title>About @ ${gameName}</title>
                    <meta http-equiv="refresh" content="0; url='${gameLink}'" />
                </head>
                <body>
                    <p>Loading ${gameName}...</p>
                </body>
                </html>
            `);
            newTab.document.close();
        }
        
        function displayGames(games) {
            const gamesGrid = document.getElementById('games');
            gamesGrid.innerHTML = games.map(game => `
                <div class="game-card" onclick="playGame('${game.name.replace(/'/g, "\\'")}', '${game.id}', '${game.link}')">
                    <h3>${game.name}</h3>
                    <p>Click to Play</p>
                    <button>▶ Play Now</button>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
