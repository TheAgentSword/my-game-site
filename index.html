<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Game Site</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        
        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }
        
        .game-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: transform 0.3s;
            cursor: pointer;
        }
        
        .game-card:hover {
            transform: translateY(-5px);
        }
        
        .game-card h3 {
            color: #667eea;
            margin-bottom: 10px;
        }
        
        .game-card p {
            color: #666;
            margin-bottom: 15px;
            font-size: 0.9em;
        }
        
        .game-card button {
            background: #667eea;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
            font-size: 1em;
        }
        
        .game-card button:hover {
            background: #764ba2;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎮 My Game Site</h1>
        <p>Play Free Games</p>
    </div>
    
    <div class="container">
        <div class="games-grid" id="games"></div>
    </div>
    
    <script>
        const games = [
            { name: 'Flappy Bird', link: 'https://flappybird.io/', id: 'flappybird' },
            { name: 'Pong', link: 'https://pong-game.org/', id: 'pong' },
            { name: 'Dino Runner', link: 'https://chromedino.com/', id: 'dino' },
            { name: '2048', link: 'https://play2048.co/', id: '2048' },
            { name: 'Tetris', link: 'https://tetris.com/play-tetris', id: 'tetris' },
            { name: 'Sudoku', link: 'https://sudoku.com/', id: 'sudoku' },
            { name: 'Pac-Man', link: 'https://pacman.live/', id: 'pacman' },
            { name: 'Snake', link: 'https://playsnakegame.org/', id: 'snake' },
            { name: 'Minesweeper', link: 'https://minesweeper.online/', id: 'minesweeper' },
            { name: 'Agar.io', link: 'https://agar.io/', id: 'agario' },
            { name: 'Slither.io', link: 'https://slither.io/', id: 'slither' },
            { name: 'Diep.io', link: 'https://diep.io/', id: 'diep' },
            { name: 'Chess.com', link: 'https://www.chess.com/', id: 'chess' },
            { name: 'Wordle', link: 'https://www.wordle.com/', id: 'wordle' },
            { name: 'Cookie Clicker', link: 'https://orteil.dashnet.org/cookieclicker/', id: 'cookieclicker' },
            { name: 'Idle Breakout', link: 'https://idlebreakout.com/', id: 'idlebreakout' },
            { name: 'Moto X3M', link: 'https://www.motox3m.io/', id: 'motox3m' },
            { name: 'Zombs Royale', link: 'https://zombsroyale.io/', id: 'zombsroyale' },
            { name: 'Solitaire', link: 'https://solitaire.com/', id: 'solitaire' },
            { name: 'A Dark Room', link: 'https://adarkroom.doublespeakgames.com/', id: 'darkroom' },
            { name: 'Tank Trouble', link: 'https://www.tanktrouble.com/', id: 'tanktrouble' },
            { name: 'Duck Hunt', link: 'https://duckhunt.me/', id: 'duckhunt' },
            { name: 'Threes!', link: 'https://threesjs.com/', id: 'threes' },
            { name: 'Breakout', link: 'https://breakoutgame.org/', id: 'breakout' },
            { name: 'Splix.io', link: 'https://splix.io/', id: 'splix' },
            { name: 'Paper.io', link: 'https://paper.io/', id: 'paperio' },
        ];
        
        function playGame(gameName, gameId, gameLink) {
            // Create a URL with the game parameter
            const gamePageURL = window.location.origin + window.location.pathname + '?game=' + gameId;
            
            // Open a new window and set its title and location
            const newTab = window.open('', '_blank');
            newTab.document.write(`
                <!DOCTYPE html>
                <html>
                <head>
                    <title>About @ ${gameName}</title>
                    <meta http-equiv="refresh" content="0; url='${gameLink}'" />
                </head>
                <body>
                    <p>Loading ${gameName}...</p>
                </body>
                </html>
            `);
            newTab.document.close();
        }
        
        function loadGames() {
            const container = document.getElementById('games');
            container.innerHTML = games.map(game => `
                <div class="game-card" onclick="playGame('${game.name}', '${game.id}', '${game.link}')">
                    <h3>${game.name}</h3>
                    <p>Click to Play</p>
                    <button>▶ Play Now</button>
                </div>
            `).join('');
        }
        
        loadGames();
    </script>
</body>
</html>
